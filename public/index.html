<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Status e histórico de disponibilidade dos serviços do PeleDex.">
  <meta name="theme-color" content="#09090c">
  <title>Status do PeleDex</title>
  <link rel="icon" href="peledex.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=9">
  <script defer src="status-data.js"></script>
  <script defer src="status.js?v=7"></script>
</head>
<body>
  <header class="masthead shell">
    <a class="brand" href="https://178-156-187-40.sslip.io/" aria-label="Ir para o site do PeleDex">
      <img src="peledex.svg" width="22" height="24" alt="">
      <span>PeleDex</span>
    </a>
    <span class="page-label">Status</span>
  </header>

  <main class="shell">
    <section class="summary" data-state="unknown" aria-labelledby="summary-heading">
      <span class="status-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path class="mark-up" d="m5 12 4 4L19 6"/><path class="mark-down" d="M12 5v8m0 5h.01"/><path class="mark-unknown" d="M12 6v6l4 3"/></svg>
      </span>
      <div class="summary-copy">
        <h1 id="summary-heading"><span id="summary-title" role="status">Aguardando dados de monitoramento</span></h1>
        <p id="updated">Checagens programadas a cada 5 minutos.</p>
      </div>
    </section>

    <section class="availability" aria-labelledby="history-title">
      <div class="section-heading">
        <h2 id="history-title">Status por serviço</h2>
        <span class="history-range">
          <button class="overall" type="button" aria-expanded="true" aria-controls="service-history"><span id="overall-state">Sem dados</span> <svg class="chevron" aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="history-window" type="button" aria-controls="service-history" hidden>Ver 90 dias</button>
        </span>
      </div>

      <div class="services" id="service-history">
        <article class="service" data-service="landing">
          <div class="service-heading">
            <h3><span class="badge" data-state="unknown" role="img" aria-label="Sem dados"></span>Site</h3>
            <span class="uptime">—</span>
          </div>
          <ol class="history" aria-label="Histórico diário do site"></ol>
          <div class="chart-caption"><span class="range-start">Há 90 dias</span><span>Hoje</span></div>
          <div class="day-details">
            <div aria-live="polite"><p class="day-label"></p><p class="day-count"></p></div>
            <div class="day-nav">
              <button type="button" data-shift="-1" aria-label="Dia anterior"><span aria-hidden="true">‹</span></button>
              <button type="button" data-shift="1" aria-label="Próximo dia"><span aria-hidden="true">›</span></button>
              <button type="button" data-close aria-label="Fechar detalhes"><span aria-hidden="true">×</span></button>
            </div>
          </div>
        </article>

        <article class="service" data-service="health">
          <div class="service-heading">
            <h3><span class="badge" data-state="unknown" role="img" aria-label="Sem dados"></span>API e banco de dados</h3>
            <span class="uptime">—</span>
          </div>
          <ol class="history" aria-label="Histórico diário da API e do banco de dados"></ol>
          <div class="chart-caption"><span class="range-start">Há 90 dias</span><span>Hoje</span></div>
          <div class="day-details">
            <div aria-live="polite"><p class="day-label"></p><p class="day-count"></p></div>
            <div class="day-nav">
              <button type="button" data-shift="-1" aria-label="Dia anterior"><span aria-hidden="true">‹</span></button>
              <button type="button" data-shift="1" aria-label="Próximo dia"><span aria-hidden="true">›</span></button>
              <button type="button" data-close aria-label="Fechar detalhes"><span aria-hidden="true">×</span></button>
            </div>
          </div>
        </article>
      </div>


</section>
    <noscript><p>Ative o JavaScript para consultar o status e o histórico.</p></noscript>
  </main>
</body>
</html>
